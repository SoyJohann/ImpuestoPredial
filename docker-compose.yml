services:
  app:
    build: .
    container_name: coactivos-predial
    restart: unless-stopped

    # Usuario sin privilegios (UID del usuario "app" en las imágenes de .NET).
    # Los datos del anfitrión en /srv/sgd deben pertenecer a este mismo UID.
    user: "1654:1654"

    # Comparte la red del anfitrión para llegar a PostgreSQL en localhost:5432
    # sin exponer la base. No se usa "ports": la app escucha en el 8080 del VPS.
    network_mode: host

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Necesario porque Nginx termina TLS y reenvía la petición a la app.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      # Solo loopback: con network_mode host, sin esto el 8080 quedaría
      # abierto en todas las interfaces y se saltaría Nginx.
      ASPNETCORE_URLS: "http://127.0.0.1:8080"

      # Sin valores por defecto: si falta la variable en .env, el arranque falla.
      ConnectionStrings__DefaultConnectionTemplate: "host=localhost;port=5432;Database={Database};username=${POSTGRES_USER:?Defina POSTGRES_USER en .env};password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}"
      ConnectionStrings__MasterConnection: "host=localhost;port=5432;Database=General_Coactivo;username=${POSTGRES_USER:?Defina POSTGRES_USER en .env};password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}"

      # La app arma la carpeta de cada documento a partir de esta plantilla.
      FileStorageTemplate: "/data/{Municipio}/{Sector}/"

    volumes:
      # Carpeta padre de documentos: la app crea {Municipio}/{Sector} dentro.
      - /srv/sgd/data:/data

      # Llaves de autenticación, en el anfitrión y fuera de /data.
      - /srv/sgd/keys:/home/app/.aspnet/DataProtection-Keys

    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
